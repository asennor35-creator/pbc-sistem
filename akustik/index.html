function hexPts(cx,cy,r){let p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}

 case 'slat':{g=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1e1f22"/>`;const n=11,bw=w/n;for(let i=0;i<n;i++)g+=`<rect x="${x+i*bw+bw*.15}" y="${y}" width="${bw*.7}" height="${h}" fill="${c1}" stroke="#00000022"/>`;break}

 case 'ribbed':{g=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.08}" fill="${c0}" ${st}/>`;for(let i=1;i<6;i++)g+=`<line x1="${x+i*w/6}" y1="${y+2}" x2="${x+i*w/6}" y2="${y+h-2}" stroke="${c2}" stroke-opacity=".45" stroke-width="${sw*1.2}"/>`;break}
 case 'fluted':{const n=6,bw=w/n;for(let i=0;i<n;i++)g+=`<rect x="${x+i*bw}" y="${y}" width="${bw}" height="${h}" rx="${bw/2}" fill="${i%2?c0:c0}" ${st}/><rect x="${x+i*bw+bw*.55}" y="${y+bw*.4}" width="${bw*.25}" height="${h-bw*.8}" rx="${bw*.12}" fill="#ffffff" fill-opacity=".18"/>`;break}
 case 'perf':{g=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c1}" ${st}/>`;const st2=w/6;for(let yy=y+st2/2;yy<y+h;yy+=st2)for(let xx=x+st2/2;xx<x+w;xx+=st2)g+=`<circle cx="${xx}" cy="${yy}" r="${st2*.16}" fill="#2a1d10"/>`;break}
 case 'tri':{const n=5,tw=w/n*1.6;for(let i=0;i<n;i++){const x0=x+i*w/n*.95,up=i%2==0;g+=up?`<path d="M${x0} ${y+h}L${x0+tw/2} ${y}L${x0+tw} ${y+h}z" fill="${[c0,c1,c2][i%3]}" ${st}/>`:`<path d="M${x0} ${y}L${x0+tw} ${y}L${x0+tw/2} ${y+h}z" fill="${[c1,c0,c2][i%3]}" ${st}/>`}break}
 case 'tiles':{for(let i=0;i<3;i++)for(let j=0;j<3;j++)g+=`<rect x="${x+i*w/3+1}" y="${y+j*h/3+1}" width="${w/3-2}" height="${h/3-2}" fill="${(i+j)%2?c1:c0}" ${st}/>`;break}

 case 'skyline':{const sh=[3,1,4,2,5,2,4,1,3,5,2,4,1,3,2,5,4,1,2,3,5,1,4,2,3];for(let i=0;i<5;i++)for(let j=0;j<5;j++){const v=sh[i*5+j];g+=`<rect x="${x+i*w/5}" y="${y+j*h/5}" width="${w/5}" height="${h/5}" fill="hsl(33,${35+v*5}%,${82-v*7}%)" stroke="#00000022"/>`}break}
 case 'head':{g=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h*.12}" fill="${c0}" ${st}/>`;for(let i=1;i<8;i++)g+=`<line x1="${x+i*w/8}" y1="${y+3}" x2="${x+i*w/8}" y2="${y+h-3}" stroke="${c2}" stroke-opacity=".35" stroke-width="${sw*1.5}"/>`;break}

function bindInput(){

 ic.querySelectorAll('.pal').forEach(b=>b.onclick=()=>{S.pal=b.dataset.p;document.getElementById('palBox').innerHTML=palCards();document.getElementById('lBox').innerHTML=layCards();document.getElementById('pBox').innerHTML=panelCards();document.getElementById('tBox').innerHTML=trapCards();document.getElementById('cBox').innerHTML=ceilCards();bindInput()});

function readInput(){
 const g=id=>document.getElementById('i_'+id),n=(v,d)=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:d};
 S.name=g('name').value.trim();S.D=clamp(n(g('D').value,5),1.5,40);S.W=clamp(n(g('W').value,4),1.5,40);S.H=clamp(n(g('H').value,3),2,10);
 S.use=g('use').value;S.floor=g('floor').value;S.wall=g('wall').value;S.ceil=g('ceil').value;
 S.ops=[...document.querySelectorAll('.oprow')].map(r=>{const q=k=>r.querySelector(`[data-k="${k}"]`).value;return {t:q('t'),wall:q('wall'),pos:Math.max(0,n(q('pos'),1)),w:clamp(n(q('w'),1),.3,10),h:clamp(n(q('h'),1),.3,10),sill:Math.max(0,n(q('sill'),0))}});

}

// ================= ACOUSTICS & LAYOUT =================
let SURF=1;
const rtOf=(V,A)=>A.map(a=>{const al=Math.min(.95,Math.max(a,.01)/SURF);return 0.161*V/(-SURF*Math.log(1-al))});
const mid=a=>(a[2]+a[3])/2;
function target(V){const u=USE[S.use];if(u.T)return u.T;const tm=clamp(0.25*Math.cbrt(V/100),.2,u.Tf?u.Tf[1]:.4);return [tm,Math.max(.2,tm-.05),Math.min(.4,tm+.05)]}
function modes(dim,tag){const r=[];for(let n=1;n<30;n++){const f=n*343/(2*dim);if(f>300)break;r.push({f,dim:tag,n})}return r}
function cornerName(c){return [L('depan-kiri','front-left'),L('depan-kanan','front-right'),L('belakang-kiri','rear-left'),L('belakang-kanan','rear-right')][c]}
function wallName(w){return {L:L('Dinding kiri','Left wall'),R:L('Dinding kanan','Right wall'),F:L('Dinding depan','Front wall'),B:L('Dinding belakang','Rear wall'),C:L('Plafon','Ceiling')}[w]}
function analyseAll(){ALL={};['hemat','std','max'].forEach(p=>ALL[p]=analyse(p));RES=ALL[S.pkg];renderOut()}
function analyse(pkg){
 const u=USE[S.use],kind=u.k,Wf=S.W,D=S.D,H=S.H,V=Wf*D*H,len={F:Wf,B:Wf,L:D,R:D};
 const ops=S.ops.map(o=>({...o,pos:clamp(o.pos,o.w/2,len[o.wall]-o.w/2),h:Math.min(o.h,H-o.sill-.02)}));
 const doorA=ops.filter(o=>o.t==='door').reduce((t,o)=>t+o.w*o.h,0),glass=ops.filter(o=>o.t==='win').reduce((t,o)=>t+o.w*o.h,0);
 const wallGross=2*(Wf+D)*H,wallNet=Math.max(0,wallGross-doorA-glass),Stot=2*Wf*D+wallGross;
 const fl=MAT.floor[S.floor].a,ce=MAT.ceil[S.ceil].a,wa=MAT.wall[S.wall].a;
 const nTab=Math.max(1,Math.floor((Wf-1.2)/1.8+1)*Math.floor((D-1.2)/1.8+1));
 const FA={kamar:[.5,1,1.6,2,2.1,2.1],mixing:[.4,.6,.8,.9,.9,.9],theater:[.6,1.2,1.8,2.2,2.3,2.3],podcast:[.3,.5,.8,.9,.9,.9],konten:[.2,.35,.5,.55,.55,.55],rekaman:[.6,.8,1.2,1.4,1.4,1.4],band:[.6,.8,1.2,1.4,1.4,1.4],rapat:[.5,.8,1.5,2,2,2].map(v=>v*Math.max(.6,D/5)),kafe:[.15,.3,.6,.75,.8,.8].map(v=>v*nTab)}[S.use];
 const A0=B.map((_,i)=>Wf*D*(fl[i]+ce[i])+wallNet*wa[i]+doorA*DOOR[i]+glass*GLASS[i]+FA[i]);
 SURF=Stot;const T0=rtOf(V,A0),TT=target(V),Tt=TT[0];
 const goal={hemat:TT[2]*1.6,std:TT[2]*.98,max:TT[0]}[pkg];
 const items=[],notes=[],blk=[],furn=[];let cnt={P:0,BT:0,C:0,D:0};
 const add=o=>{const k=o.t==='trap'?'BT':o.t==='ceil'?'C':o.t==='diff'?'D':'P';o.code=k+(++cnt[k]);if(k==='P'||k==='C')o.alt=cnt[k]%3===0;items.push(o);return o};
 const mk=pmodel(),pm=PM[mk];
 const ph=m=>PM[m].h==='full'?Math.min(2.4,H-.3):PM[m].h;
 const py=(m,cy)=>{const M=PM[m],h=ph(m);if(M.y==='full')return clamp((H-h)/2,.1,.3);if(M.y==='low')return clamp(.4,0,H-h-.1);return clamp(cy-h/2,.25,H-h-.1)};
 const GP=gp(mk,S.lay,H),gw=Math.max(...GP.map(p=>p.dx+p.w/2))-Math.min(...GP.map(p=>p.dx-p.w/2));
 const tleg=S.mT==='tube'||S.mT==='gobo'||S.mT==='membran'?.55:TM[S.mT].leg;
 const hitOp=(wall,pos,w,y0,h)=>ops.concat(blk).some(o=>o.wall===wall&&Math.abs(o.pos-pos)<(o.w+w)/2+.05&&y0<o.sill+o.h+.03&&y0+h>o.sill-.03);
 const hitIt=(wall,pos,w,y0,h)=>items.some(it=>it.wall===wall&&it.t!=='trap'&&Math.abs(it.pos-pos)<(it.w+w)/2+.05&&y0<it.y0+it.h+.05&&y0+h>it.y0-.05);
 const edge=()=>items.some(i=>i.t==='trap')?tleg+.05:.1;
 let GID=0;
 function placeGroup(wall,pos,cy,role,m){const M=PM[m];const all=gp(m,S.lay,H).slice().sort((a,b)=>Math.abs(a.dx)-Math.abs(b.dx)||a.yo-b.yo);
  const tryP=P=>{const tot=Math.max(...P.map(p=>p.yo+p.h));if(tot>H-.15)return null;const y0b=M.h==='full'?py(m,cy):M.y==='low'?clamp(.4,0,H-tot-.1):clamp(cy-tot/2,.25,H-tot-.1);
   const lo=Math.min(...P.map(p=>p.dx-p.w/2)),hi=Math.max(...P.map(p=>p.dx+p.w/2));
   for(const dp of [0,.1,-.1,.2,-.2,.3,-.3,.4,-.4,.6,-.6,.8,-.8,1,-1,1.2,-1.2]){const c=pos+dp;if(c+lo<edge()||c+hi>len[wall]-edge())continue;if(role==='refl'&&!P.some(p=>Math.abs(c+p.dx-pos)<=p.w/2-.02))continue;
    if(P.some(p=>hitOp(wall,c+p.dx,p.w,y0b+p.yo,p.h)||hitIt(wall,c+p.dx,p.w,y0b+p.yo,p.h)))continue;
    const gid=++GID;return P.map(p=>add({t:M.diff?'diff':'panel',m,wall,pos:c+p.dx,w:p.w,h:p.h,y0:y0b+p.yo,d:M.d,role,gid}))}return null};
  for(let n=all.length;n>=1;n--){const r=tryP(all.slice(0,n));if(r)return r}return null}
 function place(wall,pos,cy,role,m,y0o){if((!m||m===mk)&&y0o==null&&mk!=='head')return placeGroup(wall,pos,cy,role,mk);m=m||mk;const M=PM[m],w=M.w,h=ph(m),y0=y0o!=null?y0o:py(m,cy);if(h>H-.15)return null;
  for(const dp of [0,.25,-.25,.5,-.5,.75,-.75,1,-1]){const p=pos+dp;if(p-w/2<edge()||p+w/2>len[wall]-edge())continue;if(hitOp(wall,p,w,y0,h)||hitIt(wall,p,w,y0,h))continue;
   return add({t:M.diff?'diff':'panel',m,wall,pos:p,w,h,y0,d:M.d,role})}return null}
 // ---- bass traps ----
 const cornerBlocked=c=>{const x=c%2?Wf:0,z=c<2?0:D;return ops.some(o=>{if(o.t!=='door'&&o.sill>.3)return false;if(o.wall==='F'&&z===0||o.wall==='B'&&z===D)return Math.abs(o.pos-x)<o.w/2+tleg;if(o.wall==='L'&&x===0||o.wall==='R'&&x===Wf)return Math.abs(o.pos-z)<o.w/2+tleg;return false})};
 let wantTraps=[];
 if(kind==='listen'||kind==='live'||kind==='talk'||kind==='cam')wantTraps=[0,1,2,3];
 else if(kind==='room')wantTraps=S.cx.bass?[0,1,2,3]:[0,1];else if(kind==='speech')wantTraps=V<70||S.cx.bass?[0,1,2,3]:[0,1];
 else wantTraps=S.cx.bass?[0,1,2,3]:[];
 if(pkg==='hemat'&&wantTraps.length>2&&!S.cx.bass&&kind!=='listen'&&kind!=='live')wantTraps=wantTraps.slice(0,2);
 const armLen=Math.min(1.2,Wf/2-.5);
 wantTraps.forEach(c=>{if(cornerBlocked(c)){notes.push(L(`Sudut ${cornerName(c)} terpakai pintu, jadi bass trap di sudut itu ditiadakan.`,`The ${cornerName(c)} corner is taken by a door, so no trap there.`));return}
  add({t:'trap',m:S.mT,corner:c,leg:tleg,h:S.mT==='tube'?Math.min(1.5,H-.3):S.mT==='gobo'?Math.min(1.8,H-.3):S.mT==='membran'?Math.min(1.2,H-.6):H,arm:S.mT==='tricorner'?armLen:0})});
 // ---- furniture & people ----
 let spk=[],lis=null,ppl=[];const RP=[];const earS=1.15,earT=1.2;
 const freeSeg=(wall,w)=>{const ls=len[wall],m=edge()+.05;for(let p=ls/2;p>=w/2+m;p-=.1)for(const q of [p,ls-p]){if(q-w/2<m||q+w/2>ls-m)continue;if(!ops.some(o=>o.wall===wall&&Math.abs(o.pos-q)<(o.w+w)/2+.05))return q}return null};
 if(S.use==='kamar'){
  const bw=Math.min(1.8,Wf-1.4),bl=Math.min(2.05,D-1.4);furn.push({k:'bed',x:Wf/2,z:D-bl/2-.02,w:bw,l:bl});
  blk.push({wall:'B',pos:Wf/2,w:bw+.05,sill:0,h:.55});
  [Wf/2-bw/2-.3,Wf/2+bw/2+.3].forEach(x=>{if(x>.35&&x<Wf-.35){furn.push({k:'ns',x,z:D-.23});blk.push({wall:'B',pos:x,w:.48,sill:0,h:.65})}});
  const ww=Math.min(2.0,D-2.6);
  if(ww>=1.0){for(const wl of ['R','L']){const q=freeSeg(wl,ww);if(q!=null){furn.push({k:'ward',wall:wl,pos:q,w:ww});blk.push({wall:wl,pos:q,w:ww,sill:0,h:2.15});break}}}
 }
 if(kind==='listen'){const ly=(S.use==='theater'?.5:.38)*D,lx=Wf/2;let d=Math.min(Wf*.55,Wf-.8,(ly-.35)/.866,2.2);d=Math.max(d,.8);let sy=ly-.866*d;if(sy<.35){sy=.35;d=(ly-sy)/.866}
  lis={x:lx,z:ly};spk=[{x:lx-d/2,z:sy},{x:lx+d/2,z:sy}]}
 else if(kind==='talk'){ppl=[{x:Wf/2-.6,z:D*.45},{x:Wf/2+.6,z:D*.45}]}
 else if(kind==='cam'){ppl=[{x:Wf/2,z:D*.62}]}
 // ---- essential placements (reasoned) ----
 if(kind==='listen'){
  ['L','R'].forEach(w=>{const r=spk.map(s=>{const wx=w==='L'?0:Wf,dS=Math.abs(wx-s.x),dL=Math.abs(wx-lis.x);return s.z+(lis.z-s.z)*dS/(dS+dL)}).sort((a,b)=>a-b);
   RP.push(...r.map(z=>({wall:w,z})));const cov=z=>items.some(i=>i.t==='panel'&&i.wall===w&&Math.abs(i.pos-z)<=i.w/2+.02&&i.y0<=1.25&&i.y0+i.h>=1.15);if(r[1]-r[0]<gw*.75)place(w,(r[0]+r[1])/2,earT,'refl');r.forEach(p=>{if(!cov(p))place(w,p,earT,'refl')});r.forEach(p=>{if(!cov(p))place(w,p,earT,'refl','kotak')})});
  spk.forEach(s=>place('F',s.x,earT,'front','kotak'));
  if(D-lis.z>=2.4&&Wf>=2.4&&S.use!=='band'){[-.31,.31].forEach(o=>place('B',Wf/2+o,earT,'rear','skyline'))}
  if(pkg!=='hemat')[Wf/2-.95,Wf/2+.95,Wf/2].forEach(p=>place('B',p,earT,'rear','kotak'));
 }else if(kind==='talk'){const tz=D*.45;place('L',tz,earS,'refl');place('R',tz,earS,'refl');place('F',Wf/2,earS,'behind');place('B',Wf/2,earS,'behind')}
 else if(kind==='cam'){const pz=D*.62;place('B',Wf/2,earS,'bg');place('F',Wf/2,earS,'face');place('L',pz,earS,'refl');place('R',pz,earS,'refl')}
 else if(kind==='room'){if(mk==='head')place('B',Wf/2,1.1,'head','head',.5);else if(PM[mk].h==='full'){const hh=Math.round((H-.15-.95)*100)/100,P=gp(mk,S.lay,H).map(p=>({...p,h:Math.min(p.h,hh),yo:0}));const gid=++GID;P.forEach(p=>{const x=Wf/2+p.dx;if(x-p.w/2>edge()&&x+p.w/2<Wf-edge()&&!hitOp('B',x,p.w,.95,p.h)&&!hitIt('B',x,p.w,.95,p.h))add({t:'panel',m:mk,wall:'B',pos:x,w:p.w,h:p.h,y0:.95,d:PM[mk].d,role:'head',gid})})}else place('B',Wf/2,1.6,'head')}
 // ---- ceiling ----
 const ceilOK=S.mC!=='none'&&H>=2.4;if(S.mC!=='none'&&H<2.4)notes.push(L('Plafon di bawah 2,4 m: item plafon tidak dipasang supaya tidak terbentur kepala.','Ceiling below 2.4 m: no hanging items.'));
 const addCeil=(x,z)=>{if(!ceilOK)return null;const cw=1.2,cd=S.mC==='cloud'?1.2:.05;if(x-cw/2<.3||x+cw/2>Wf-.3||z-.6<.3||z+.6>D-.3)return null;
  if(items.some(i=>i.t==='ceil'&&Math.abs(i.x-x)<(S.mC==='cloud'?1.25:1.25)&&Math.abs(i.z-z)<(S.mC==='cloud'?1.25:.7)))return null;
  return add({t:'ceil',m:S.mC,x,z,w:cw,d:cd,h:S.mC==='cloud'?.1:.6,drop:S.mC==='cloud'?(H>=2.7?.2:.08):.15,wall:'C',role:'ceil'})};
 if(S.mC==='cloud'&&pkg!=='hemat'){if(kind==='listen')addCeil(lis.x,(spk[0].z+lis.z)/2);if(kind==='talk')addCeil(Wf/2,D*.45);if(kind==='cam')addCeil(Wf/2,D*.62-.4);if(kind==='live')addCeil(Wf/2,D*.62)}
 // ---- absorption ----
 function after(){let cover=0;const A=B.map(()=>0);
  items.forEach(it=>{let a,face,cov=0;
   if(it.t==='panel'||it.t==='diff'){const M=PM[it.m];a=M.a;face=it.w*it.h*M.af;cov=it.w*it.h*Math.min(1,M.af)}
   else if(it.t==='trap'){a=TM[it.m].a;const h=it.h,m=it.m;
    if(m==='chunk'||m==='slatc'){face=it.leg*Math.SQRT2*h;cov=2*it.leg*h}else if(m==='tricorner'){face=it.leg*Math.SQRT2*(h+2*it.arm);cov=2*it.leg*h}
    else if(m==='soffit'){const sl=Wf-2*it.leg;face=it.leg*Math.SQRT2*(h+(it.corner<2?sl/2:sl/2));cov=2*it.leg*h}
    else if(m==='straddle'){face=.6*h;cov=.84*h}else if(m==='curve'||m==='curvslat'){face=Math.PI/2*.6*h;cov=1.2*h}
    else if(m==='tube'){face=Math.PI*.2*h*1.6;cov=0}else if(m==='gobo'){face=.6*h*1.6;cov=0}else{face=.5*h*2;cov=.5*h*2}}
   else{a=CM[it.m].a;face=it.m==='cloud'?it.w*it.d*1.15:2*it.w*it.h}
   it.face=face;cover+=cov;B.forEach((_,i)=>A[i]+=face*a[i])});
  return B.map((_,i)=>A[i]+Wf*D*(fl[i]+ce[i])+Math.max(0,wallNet-cover)*wa[i]+doorA*DOOR[i]+glass*GLASS[i]+FA[i])}
 // ---- fill candidates (staggered) ----
 const step=Math.max(gw+.4,.95);
 const row=(wall,start)=>{const r=[];for(let p=start;p<=len[wall]-.3;p+=step)r.push({wall,pos:p});return r};
 const ceilGrid=()=>{const r=[];if(!ceilOK)return r;const sx=S.mC==='cloud'?1.8:.9,sz=S.mC==='cloud'?1.8:.9;for(let z=.9;z<=D-.9;z+=sz)for(let x=.9;x<=Wf-.9+1e-6;x+=sx)r.push({ceil:1,x,z});return r};
 const inter=(...arrs)=>{const o=[];const m=Math.max(...arrs.map(a=>a.length));for(let i=0;i<m;i++)arrs.forEach(a=>{if(a[i])o.push(a[i])});return o};
 const so=step/2,cy=kind==='speech'||kind==='venue'||kind==='room'?1.4:earT;let C=[];
 if(kind==='listen'){for(let p=lis.z+.7;p<=D-.4;p+=step)C.push([{wall:'L',pos:p},{wall:'R',pos:p}]);for(let p=.6;p<lis.z-.4;p+=step)C.push([{wall:'L',pos:p},{wall:'R',pos:p}]);C.push(...ceilGrid().map(c=>[c]),...row('F',.5).map(c=>[c]),...row('B',.5).map(c=>[c]))}
 else if(kind==='talk'||kind==='cam'||kind==='live'){C.push(...inter(row('L',.6),row('R',.6+so),row('F',.6),row('B',.6+so)).map(c=>[c]),...ceilGrid().map(c=>[c]))}
 else if(kind==='room'){C.push(...inter(row('L',.6),row('R',.6+so),row('F',.6+so),row('B',.6)).map(c=>[c]),...ceilGrid().map(c=>[c]))}
 else if(kind==='speech'){const cg=ceilGrid();C.push(...cg.slice(0,Math.ceil(cg.length/2)).map(c=>[c]),...inter(row('L',.6),row('B',.6),row('R',.6+so),row('F',.6+so)).map(c=>[c]),...cg.slice(Math.ceil(cg.length/2)).map(c=>[c]))}
 else{C.push(...ceilGrid().map(c=>[c]),...inter(row('L',.6),row('B',.6),row('R',.6+so),row('F',.6+so)).map(c=>[c]))}
 let A1=after(),T1=rtOf(V,A1),ci=0;
 while(mid(T1)>goal&&ci<C.length){C[ci++].forEach(c=>{if(c.ceil)addCeil(c.x,c.z);else place(c.wall,c.pos,cy,'fill')});A1=after();T1=rtOf(V,A1)}

 <div class="prob sol" style="margin-top:14px"><b>${L('Aturan material','Material rules')}</b><span>${L('Kain penutup harus tembus udara (mudah ditiup) — kain rapat / plastik membuat panel tidak menyerap. Bass trap tebal pakai rockwool 40–60 kg/m³; panel 5–10 cm pakai 60–80 kg/m³. Rongga udara di belakang panel menambah serapan bass. Pakai sarung tangan & masker saat memotong rockwool.','Covers must be breathable. Thick traps use 40–60 kg/m³ wool; 50–100 mm panels use 60–80 kg/m³. An air gap behind adds bass absorption. Wear gloves and a mask when cutting.')}</span></div></section>`;
